spring:
  main:
    banner-mode: off

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  flyway:
    baseline-on-migrate: true
    out-of-order: false
    validate-on-migrate: false

  jpa:
    show-sql: false

server:
  tomcat:
    threads:
      max: 50
      min-spare: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: MotherHood Journey
    profile: production

logging:
  level:
    com.motherhood: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    root: WARN
