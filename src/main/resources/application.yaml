# Application
app:
  escalation:
    pending-hours: ${ESCALATION_PENDING_HOURS:48}

server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Motherhood Journey DB}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 1000ms
      timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:10485760}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Account lockout
auth:
  lockout:
    max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
    duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}

# Appointment capacity
appointment:
  slot-minutes: ${APPOINTMENT_SLOT_MINUTES:30}
  max-per-slot: ${APPOINTMENT_MAX_PER_SLOT:10}

# Africa's Talking SMS
africas-talking:
  api-key: ${AT_API_KEY}
  username: ${AT_USERNAME}
  sender-id: ${AT_SENDER_ID:}

# Irembo Government Integration
irembo:
  api:
    base-url: ${IREMBO_BASE_URL:}
    key: ${IREMBO_API_KEY:}

# HMIS API
hmis:
  api:
    base-url: ${HMIS_BASE_URL:}
    key: ${HMIS_API_KEY:}

# NIDA API
nida:
  base-url: ${NIDA_BASE_URL:}

# File storage (service-request documents)
storage:
  local:
    root: ${STORAGE_LOCAL_ROOT:./uploads}
  max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: motherhood-journey

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    persist-authorization: true
  show-actuator: false
  default-produces-media-type: application/json

# Logging
logging:
  level:
    com.motherhood: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
