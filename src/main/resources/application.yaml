# Application
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  escalation:
    pending-hours: ${ESCALATION_PENDING_HOURS:48}

server:
  port: ${APP_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Africa's Talking SMS
africas-talking:
  api-key: ${AT_API_KEY}
  username: ${AT_USERNAME}

# Irembo Government Integration
irembo:
  base-url: ${IREMBO_BASE_URL:}
  api-key: ${IREMBO_API_KEY:}

# NIDA API
nida:
  base-url: ${NIDA_BASE_URL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.motherhood: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
