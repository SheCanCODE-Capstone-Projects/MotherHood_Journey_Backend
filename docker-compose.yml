services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: motherhood_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d \"${DB_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - motherhood_net

  # ── Spring Boot Application ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME}/${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG:-latest}
    container_name: motherhood_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:           prod
      # Use postgres service name — not localhost
      SPRING_DATASOURCE_URL:            ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${DB_NAME}}
      SPRING_DATASOURCE_USERNAME:       ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD:       ${DB_PASSWORD}
      SPRING_FLYWAY_ENABLED:            "true"
      JWT_SECRET:                       ${JWT_SECRET}
      JWT_EXPIRATION_MS:                ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS:        ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS:             ${CORS_ALLOWED_ORIGINS}
      SERVER_PORT:                      ${APP_PORT:-8080}
      AT_API_KEY:                       ${AT_API_KEY:-}
      AT_USERNAME:                      ${AT_USERNAME:-}
      IREMBO_BASE_URL:                  ${IREMBO_BASE_URL:-}
      IREMBO_API_KEY:                   ${IREMBO_API_KEY:-}
      HMIS_BASE_URL:                    ${HMIS_BASE_URL:-}
      HMIS_API_KEY:                     ${HMIS_API_KEY:-}
      NIDA_BASE_URL:                    ${NIDA_BASE_URL:-}
      ESCALATION_PENDING_HOURS:         ${ESCALATION_PENDING_HOURS:-48}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 384M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - motherhood_net

volumes:
  postgres_data:
    driver: local

networks:
  motherhood_net:
    driver: bridge
