name: Health Check
description: >
  Polls a health endpoint until it returns HTTP 200 or the retry
  limit is reached. Accepts either a full URL (recommended for Railway)
  or separate host/port/scheme components.

inputs:
  url:
    description: Full URL to poll, e.g. https://myapp.up.railway.app/actuator/health
    required: false
    default: ""
  host:
    description: Hostname or IP (used only when 'url' is not set)
    required: false
    default: ""
  port:
    description: Port number (used only when 'url' is not set)
    required: false
    default: "8080"
  scheme:
    description: Protocol — "http" or "https" (used only when 'url' is not set)
    required: false
    default: http
  path:
    description: Health endpoint path (used only when 'url' is not set)
    required: false
    default: /actuator/health
  max-retries:
    description: Maximum number of polling attempts before failing
    required: false
    default: "12"
  interval:
    description: Seconds to wait between each attempt
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - name: Poll health endpoint
      shell: bash
      env:
        INPUT_URL:   ${{ inputs.url }}
        SCHEME:      ${{ inputs.scheme }}
        HOST:        ${{ inputs.host }}
        PORT:        ${{ inputs.port }}
        PATH_SUFFIX: ${{ inputs.path }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        INTERVAL:    ${{ inputs.interval }}
      run: |
        if [ -n "$INPUT_URL" ]; then
          URL="$INPUT_URL"
        else
          URL="${SCHEME}://${HOST}:${PORT}${PATH_SUFFIX}"
        fi

        echo "Polling $URL (max ${MAX_RETRIES} attempts, ${INTERVAL}s apart)"

        for i in $(seq 1 "$MAX_RETRIES"); do
          HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "$URL" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed on attempt $i — HTTP $HTTP_STATUS"
            exit 0
          fi

          echo "Attempt $i/${MAX_RETRIES} — HTTP $HTTP_STATUS. Retrying in ${INTERVAL}s..."
          sleep "$INTERVAL"
        done

        echo "Health check FAILED after ${MAX_RETRIES} attempts. Last status: $HTTP_STATUS"
        exit 1
