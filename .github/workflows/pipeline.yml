name: Motherhood Journey CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/motherhood-journey
  JAVA_VERSION: "21"

jobs:

  # ═══════════════════════════════════════════════════════════════════
  #  STAGE 1 – TEST
  # ═══════════════════════════════════════════════════════════════════
  test:
    name: "Stage 1 – Test"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       motherhood_test
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: ./.github/actions/java-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/motherhood_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_pass
          SPRING_PROFILES_ACTIVE:     test
          JWT_SECRET:                 test-secret-key-for-ci-only-not-production
        run: mvn test --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════
  #  STAGE 2 – BUILD & PUSH
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: "Stage 2 – Build & Push Image"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_tag:    ${{ steps.docker.outputs.image_tag }}
      image_digest: ${{ steps.docker.outputs.image_digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: ./.github/actions/java-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build and push Docker image
        id: docker
        uses: ./.github/actions/docker-build-push
        with:
          image:                ${{ env.DOCKER_IMAGE }}
          docker-hub-username:  ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-hub-token:     ${{ secrets.DOCKER_HUB_TOKEN }}
          is-main:              ${{ github.ref == 'refs/heads/main' }}

  # ═══════════════════════════════════════════════════════════════════
  #  STAGE 3 – PRODUCTION DEPLOY  (main branch only)
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 3 – Deploy to Railway"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    environment:
      name: production
      url:  https://motherhoodjourneybackend-production.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Wait for Railway to spin up
        run: sleep 60

      - name: Health check
        uses: ./.github/actions/health-check
        with:
          url:         https://motherhoodjourneybackend-production.up.railway.app/actuator/health
          max-retries: "12"
          interval:    "10"

      - name: Smoke tests
        uses: ./.github/actions/smoke-test
        with:
          base-url: https://motherhoodjourneybackend-production.up.railway.app

      - name: Deployment summary
        run: |
          echo "### Production Deployment Complete"                                            >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKER_IMAGE }}:${{ needs.build.outputs.image_tag }}\`"  >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ needs.build.outputs.image_digest }}\`"                      >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://motherhoodjourneybackend-production.up.railway.app"          >> $GITHUB_STEP_SUMMARY
